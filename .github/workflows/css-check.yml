name: CSS Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Stylelint
        run: npm install --no-save stylelint stylelint-config-recommended

      - name: Check every CSS file
        run: npx stylelint "**/*.css" --allow-empty-input
