name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links and images on every page
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 './**/*.html'
          fail: true
